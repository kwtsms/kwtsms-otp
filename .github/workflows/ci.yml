# FILE:    .github/workflows/ci.yml
# CREATED: 2026-11-16 02:00 +03
# TASK:    int-node-boilerplates
# WHAT:    Lint, types (incl. the Workers example), core unit tests, build and pack on Node 20/22/24; HTTP E2E on Node and on Bun.
# WHY:     Design v2: Node 20/22/24 + Bun in CI; Workers is typecheck only; weekly run catches upstream breakage.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run -w kwtsms-otp
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun -v
      - run: npm ci
      - run: npm run build
      # E2E_REQUIRE_BUN=1: the Bun run fails instead of being skipped when bun is missing
      - run: npx vitest run starter
        env:
          E2E_REQUIRE_BUN: "1"
